spring.application.name=support-ticket-system

# File-backed H2 configuration (persists data to disk across restarts)
spring.datasource.url=jdbc:h2:file:./data/ticketdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configuration (updates schema without wiping tables)
spring.jpa.hibernate.ddl-auto=update